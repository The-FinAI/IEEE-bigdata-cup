name: Quality

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "release-*"
  workflow_dispatch:
    inputs:
      release_gate:
        description: Fail unless every starter-kit release marker is resolved
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  node:
    name: Node.js checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test site
        run: npm test

      - name: Test repository contract
        run: node --test tests/repository-contract.test.mjs

  starter-kit:
    name: Starter-kit checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: starter-kit
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Test starter-kit contracts
        run: python -m unittest discover -s tests

      - name: Enforce release readiness
        if: startsWith(github.ref, 'refs/tags/release-') || (github.event_name == 'workflow_dispatch' && inputs.release_gate == true)
        run: python scripts/release_readiness.py
