name: Site quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.scenario }} Pages build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: development-unconfigured
            site_mode: development
            development_space_url: ""
            test_space_url: ""
            leaderboard_api_url: ""
          - scenario: development-staged
            site_mode: development
            development_space_url: https://task1-development-ci.hf.space/
            test_space_url: https://task1-test-ci.hf.space/
            leaderboard_api_url: https://mbzuai-finreason-task1-rehearsal.hf.space/api/leaderboard?phase=development&view=aggregate
          - scenario: final-spaces-only
            site_mode: final
            development_space_url: https://task1-development-ci.hf.space/
            test_space_url: https://task1-test-ci.hf.space/
            leaderboard_api_url: ""
          - scenario: final-spaces-with-api
            site_mode: final
            development_space_url: https://task1-development-ci.hf.space/
            test_space_url: https://task1-test-ci.hf.space/
            leaderboard_api_url: https://mbzuai-finreason-task1-rehearsal.hf.space/api/leaderboard?phase=development&view=aggregate
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Build and verify static site
        env:
          FINREASON_TASK1_SITE_MODE: ${{ matrix.site_mode }}
          NEXT_PUBLIC_FINREASON_TASK1_DEVELOPMENT_SPACE_URL: ${{ matrix.development_space_url }}
          NEXT_PUBLIC_FINREASON_TASK1_TEST_SPACE_URL: ${{ matrix.test_space_url }}
          NEXT_PUBLIC_FINREASON_TASK1_LEADERBOARD_API_URL: ${{ matrix.leaderboard_api_url }}
        run: npm test
