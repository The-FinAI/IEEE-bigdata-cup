name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build static site
        env:
          FINREASON_TASK1_SITE_MODE: ${{ vars.FINREASON_TASK1_SITE_MODE || 'development' }}
          NEXT_PUBLIC_FINREASON_TASK1_HF_SPACE_URL: ${{ vars.NEXT_PUBLIC_FINREASON_TASK1_HF_SPACE_URL }}
          NEXT_PUBLIC_FINREASON_TASK1_LEADERBOARD_API_URL: ${{ vars.NEXT_PUBLIC_FINREASON_TASK1_LEADERBOARD_API_URL }}
        run: npm run build:pages

      - name: Verify rendered site and public data contracts
        env:
          FINREASON_TASK1_SITE_MODE: ${{ vars.FINREASON_TASK1_SITE_MODE || 'development' }}
          NEXT_PUBLIC_FINREASON_TASK1_HF_SPACE_URL: ${{ vars.NEXT_PUBLIC_FINREASON_TASK1_HF_SPACE_URL }}
          NEXT_PUBLIC_FINREASON_TASK1_LEADERBOARD_API_URL: ${{ vars.NEXT_PUBLIC_FINREASON_TASK1_LEADERBOARD_API_URL }}
        run: >-
          node --test
          tests/rendered-html.test.mjs
          tests/task1-leaderboard.test.mjs
          tests/task1-public-config.test.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./out

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      pages: write
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
