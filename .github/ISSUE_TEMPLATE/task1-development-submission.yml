name: Task 1 development submission
description: Submit one locally encrypted 580-row V4 development predictions ZIP.
title: "[Task 1 DEV] Encrypted submission"
labels:
  - task1-development-submission
body:
  - type: markdown
    attributes:
      value: |
        ## Official Task 1 development intake

        Attach only the encrypted JSON produced by the Task 1 participant hub. Never attach a plaintext predictions ZIP. This issue, its author, timestamp, and encrypted attachment URL are public; encryption protects the ZIP contents, not that metadata.

        Team identity is derived only from the immutable numeric GitHub actor ID recorded by GitHub; the login is recorded for display. Text entered into this form is not trusted as identity. Each team must use one designated GitHub account.

  - type: upload
    id: encrypted_submission
    attributes:
      label: Encrypted submission file
      description: Upload exactly one finreason-task1-dev-*.json file generated by the participant hub.
    validations:
      accept: ".json"
      required: true

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Submission acknowledgement
      options:
        - label: I attached ciphertext only and understand that the issue metadata and encrypted attachment URL are public.
          required: true
        - label: This is the one designated GitHub account for my team.
          required: true
        - label: I agree to the published Terms of Participation and Privacy Notice.
          required: true
