name: Claim an organizer workstream
description: Volunteer for one open FinReason Cup organizer workstream.
title: "[CLAIM] "
labels: []
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Use this form to claim work you can actively deliver. Opening the issue records your interest; scope and handoffs can be clarified in the issue without pre-assigning anyone.

  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      description: Select the single workstream you want to claim.
      options:
        - C-T2 — Task 2
        - C-T3 — Task 3
        - C-PUB — Publicity and outreach
        - C-REV — Reviewer coordination
        - C-B1 — Task 1 baseline
        - C-B2 — Task 2 baseline
        - C-B3 — Task 3 baseline
    validations:
      required: true

  - type: textarea
    id: contribution
    attributes:
      label: What will you deliver?
      description: Describe the concrete output you can own.
      placeholder: "For example: implement and document a reproducible baseline, including tests and usage instructions."
    validations:
      required: true

  - type: textarea
    id: plan
    attributes:
      label: Proposed plan
      description: Outline your first steps, expected handoffs, and any dependencies. Do not assume an unconfirmed official date, platform, or rule.
      placeholder: |
        First steps:
        Expected handoffs:
        Dependencies or open questions:
    validations:
      required: true

  - type: textarea
    id: relevant_experience
    attributes:
      label: Relevant context
      description: Optionally link relevant code, documents, or prior work. Do not post a personal email address.
    validations:
      required: false

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Acknowledgement
      options:
        - label: I am volunteering for this workstream and will flag blockers or availability changes in this issue.
          required: true
