[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finreason-task3"
version = "1.0.0"
description = "FinReason Cup 2026 - Task 3 (Financial Audit Verification) starter kit and official evaluator"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "huggingface_hub>=0.24,<1.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "openai>=1.40",
    "PyYAML>=6.0",
    "tqdm>=4.65",
]

[project.optional-dependencies]
anthropic = ["anthropic>=1.0"]
hf = ["torch", "transformers>=4.40", "accelerate"]
vllm = ["vllm"]
dev = ["pytest>=7.4"]

[tool.setuptools]
packages = ["task3_core", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:task3_core.*"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
