name: Release blocker
description: Report a reproducible issue that blocks a public release or participant workflow.
title: "[Release blocker] "
labels: []
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Use this form for a concrete, reproducible blocker. Do not disclose credentials, private data, answer keys, hidden evaluation data, or other restricted artifacts.

  - type: dropdown
    id: task
    attributes:
      label: Task
      description: Select the affected task or cross-task release area.
      options:
        - Task 1
        - Task 2
        - Task 3
        - Cross-task release infrastructure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Provide the affected public release tag, commit SHA, package version, or dataset version.
      placeholder: "For example: release tag, commit SHA, or package version"
    validations:
      required: true

  - type: textarea
    id: blocker
    attributes:
      label: Blocker and impact
      description: Explain what is blocked, who is affected, and why the release or participant workflow cannot proceed.
      placeholder: |
        Blocked action:
        Impact:
        Expected behavior:
        Actual behavior:
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence of public commands or actions that reliably reproduces the blocker.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paste a minimal public log or error message, or attach a redacted screenshot. Remove secrets, personal information, private data, and hidden evaluation content.
      render: shell
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Known workaround
      description: If available, describe a safe temporary workaround and its limitations.
    validations:
      required: false
