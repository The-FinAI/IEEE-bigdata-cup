name: Site and Task 1 quality

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22.13.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.13.0
          cache: npm

      - name: Set up CPython 3.11.4
        uses: actions/setup-python@a30959b7e87c8eb30e219a16bc70b1654f7c3ea0 # v6.2.0
        with:
          python-version: 3.11.4

      - name: Install dependencies
        run: npm ci

      - name: Run static and Node tests
        run: npm test

      - name: Run hosted Python contract tests
        run: python3 -m unittest tests.test_task1_development_scorer

      - name: Verify Pages privacy boundary
        run: node scripts/task1/verify-public-boundary.mjs --root out
