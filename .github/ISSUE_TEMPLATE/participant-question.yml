name: Participant question
description: Ask a reproducible question about a task, release, or participant workflow.
title: "[Question] "
labels: []
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Please include enough detail for organizers to reproduce the question. Do not post personal email addresses, credentials, private data, or hidden evaluation material.

  - type: dropdown
    id: task
    attributes:
      label: Task
      description: Select the task most closely related to the question.
      options:
        - Task 1
        - Task 2
        - Task 3
        - Cross-task or participant workflow
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Provide the relevant public release tag, commit SHA, package version, or dataset version.
      placeholder: "For example: release tag, commit SHA, or package version"
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: Question
      description: State what you expected and what remains unclear.
      placeholder: |
        Expected:
        Question:
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Provide the smallest sequence of public commands or actions that reproduces the question.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Paste a minimal public log or error message, or attach a redacted screenshot. Remove secrets, personal information, private data, and hidden evaluation content.
      render: shell
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Optionally include the operating system, runtime, dependency, and container details needed to reproduce the issue.
    validations:
      required: false
