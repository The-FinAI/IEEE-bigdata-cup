name: Task 1 development submission

on:
  issues:
    types:
      - opened

permissions: {}

concurrency:
  group: task1-development-actor-${{ github.event.issue.user.id }}
  cancel-in-progress: false

jobs:
  intake:
    if: contains(github.event.issue.labels.*.name, 'task1-development-submission')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js 22.13.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.13.0

      - name: Validate event and download bounded ciphertext
        run: node scripts/task1/intake.mjs --event "$GITHUB_EVENT_PATH" --out "$RUNNER_TEMP/task1-intake"

      - name: Pass ciphertext to the protected evaluator
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task1-development-intake-${{ github.event.issue.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task1-intake
          if-no-files-found: error
          retention-days: 1

  score:
    needs: intake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: task1-pilot
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - name: Check out trusted evaluator source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js 22.13.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.13.0

      - name: Set up CPython 3.11.4
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.11.4

      - name: Download encrypted intake
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: task1-development-intake-${{ github.event.issue.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task1-intake

      - name: Decrypt, enforce policy, admit, and score exact V4 development
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TASK1_PILOT_PRIVATE_KEY_PKCS8_B64: ${{ secrets.TASK1_PILOT_PRIVATE_KEY_PKCS8_B64 }}
          TASK1_PILOT_SIGNING_PRIVATE_KEY_PKCS8_B64: ${{ secrets.TASK1_PILOT_SIGNING_PRIVATE_KEY_PKCS8_B64 }}
          TASK1_PYTHON: python3
        run: |
          node scripts/task1/score-development.mjs \
            --intake "$RUNNER_TEMP/task1-intake/intake.json" \
            --envelope "$RUNNER_TEMP/task1-intake/envelope.json" \
            --reference "evaluator/task1/dev-reference.enc.json" \
            --out "$RUNNER_TEMP/task1-result.json"

      - name: Pass signed aggregate-only result to publisher
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: task1-development-result-${{ github.event.issue.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task1-result.json
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: score
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out trusted publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js 22.13.0
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.13.0

      - name: Download signed aggregate-only result
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: task1-development-result-${{ github.event.issue.number }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/task1-result

      - name: Publish exactly one result, close, and lock
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/task1/publish-result.mjs \
            --event "$GITHUB_EVENT_PATH" \
            --result "$RUNNER_TEMP/task1-result/task1-result.json"
