name: Task 1 GitHub-only pilot submission
description: Organizer-only test of encrypted upload, automatic scoring, and leaderboard publication.
title: "[Task 1 pilot] "
labels:
  - task1-pilot-submission
body:
  - type: markdown
    attributes:
      value: |
        ## Synthetic organizer pilot

        This form is not an official competition submission route. It accepts only the encrypted JSON file produced by the Task 1 pilot page and uses no competition questions or gold answers.

        Do not attach a plaintext predictions ZIP. GitHub attachments in a public repository are publicly accessible.

  - type: input
    id: github_login
    attributes:
      label: GitHub login
      description: This must exactly match the account creating this issue.
      placeholder: ZhuohanX
    validations:
      required: true

  - type: upload
    id: encrypted_submission
    attributes:
      label: Encrypted submission file
      description: Upload exactly one finreason-task1-pilot-*.json file generated by the pilot page.
    validations:
      required: true
      accept: ".json"

  - type: checkboxes
    id: acknowledgement
    attributes:
      label: Pilot acknowledgement
      options:
        - label: I understand that this is a synthetic infrastructure test and not an official FinReason Cup score.
          required: true
